<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book a Photoshoot | AF Studio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #151515;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #292929;
        }

        h1 {
            color: #d2b47c;
            text-align: center;
        }

        p {
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #252525;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 1px solid #d2b47c;
            border-color: #d2b47c;
        }

        button {
            margin-top: 22px;
            padding: 14px;
            width: 100%;
            background: #d2b47c;
            color: #080808;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #e6ca96;
        }

        button:disabled {
            background: #555;
            color: #ccc;
            cursor: not-allowed;
        }

        #availability {
            padding: 12px;
            margin-top: 20px;
            background: #252525;
            border-left: 3px solid #d2b47c;
            color: #d2b47c;
            border-radius: 4px;
            line-height: 1.5;
        }

        a {
            color: #d2b47c;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .note {
            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Book a Photoshoot</h1>

        <p>
            Choose your preferred date and time to book your
            photography session with AF Studio.
        </p>

        <form action="/book" method="POST">

            <label for="name">Your name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <label for="phone">Phone number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

            <label for="service">Photography type</label>
            <select id="service" name="service" required>
                <option value="Portrait">Portrait</option>
                <option value="Wedding">Wedding</option>
                <option value="Events">Events</option>
                <option value="Nature">Other</option>
            </select>

            <label for="date">Booking date</label>
            <input
                type="date"
                id="date"
                name="date"
                required
            >

            <label for="time">Booking time</label>
            <select id="time" name="time" required>
                <option value="10:00">10:00 AM</option>
                <option value="12:00">12:00 PM</option>
                <option value="15:00">3:00 PM</option>
                <option value="17:00">5:00 PM</option>
            </select>

            <label for="details">Additional details</label>
            <textarea
                id="details"
                name="details"
                rows="3"
                placeholder="Tell us about your photoshoot"
            ></textarea>

            <div id="availability" role="status" aria-live="polite">
                Select a date and time to check availability.
            </div>

            <p class="note">
                Your booking request will be confirmed by the studio.
            </p>

            <button type="submit" id="bookingButton">
                REQUEST BOOKING
            </button>

        </form>

        <div class="back-link">
            <a href="/">← Back to Home</a>
        </div>

    </div>

    <script>
        // Booking data is provided by app.py
        const bookedSlots = {{ booked_slots | default([], true) | tojson }};

        const dateInput = document.getElementById("date");
        const timeInput = document.getElementById("time");
        const availability = document.getElementById("availability");
        const bookingButton = document.getElementById("bookingButton");

        // Prevent selecting a date in the past.
        const today = new Date();
        const year = today.getFullYear();
        const month = String(today.getMonth() + 1).padStart(2, "0");
        const day = String(today.getDate()).padStart(2, "0");

        dateInput.min = `${year}-${month}-${day}`;

        function checkAvailability() {
            if (!dateInput.value || !timeInput.value) {
                availability.textContent =
                    "Select a date and time to check availability.";

                bookingButton.disabled = false;
                return;
            }

            const selectedDate = dateInput.value;
            const selectedTime = timeInput.value;

            const isBooked = bookedSlots.some(function(slot) {
                return slot.date === selectedDate &&
                       slot.time === selectedTime;
            });

            if (isBooked) {
                availability.textContent =
                    "This time is unavailable. Please choose another time.";

                availability.style.borderLeftColor = "#ff5555";
                availability.style.color = "#ff7777";

                bookingButton.disabled = true;
            } else {
                availability.textContent =
                    "This time appears available. Your request needs studio confirmation.";

                availability.style.borderLeftColor = "#55cc77";
                availability.style.color = "#55cc77";

                bookingButton.disabled = false;
            }
        }

        dateInput.addEventListener("change", checkAvailability);
        timeInput.addEventListener("change", checkAvailability);

        checkAvailability();
    </script>

</body>
</html>
